name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  SWIFTLINT_VERSION: 0.65.1
  SWIFTFORMAT_VERSION: 0.64.5

jobs:
  # macOS runners are scarce, so lint and every platform build share one job.
  lint-and-build:
    name: Lint and build
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
        with:
          # SwiftFormat reads each file's creation year from the Git history for the header check.
          fetch-depth: 0
      - name: Install pinned SwiftLint and SwiftFormat
        run: |
          curl -sSfL -o swiftlint.zip \
            "https://github.com/realm/SwiftLint/releases/download/$SWIFTLINT_VERSION/portable_swiftlint.zip"
          curl -sSfL -o swiftformat.zip \
            "https://github.com/nicklockwood/SwiftFormat/releases/download/$SWIFTFORMAT_VERSION/swiftformat.zip"
          unzip -oq swiftlint.zip -d "$RUNNER_TEMP/lint-tools"
          unzip -oq swiftformat.zip -d "$RUNNER_TEMP/lint-tools"
          echo "$RUNNER_TEMP/lint-tools" >> "$GITHUB_PATH"
      - name: SwiftLint
        run: swiftlint lint --strict
      - name: SwiftFormat
        run: swiftformat --lint .
      - name: Build for every platform
        run: |
          for platform in "iOS" "macOS" "macOS,variant=Mac Catalyst" "tvOS" "watchOS" "visionOS"; do
            echo "::group::$platform"
            xcodebuild build -scheme SimpleHaptics -destination "generic/platform=$platform" \
              SWIFT_TREAT_WARNINGS_AS_ERRORS=YES
            echo "::endgroup::"
          done
      - name: Build the example app
        run: >
          xcodebuild build
          -project Examples/SimpleHapticsDemo/SimpleHapticsDemo.xcodeproj
          -scheme SimpleHapticsDemo
          -destination "generic/platform=iOS Simulator"
          CODE_SIGNING_ALLOWED=NO

  test:
    name: Test (macOS, iOS)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - name: Test on macOS
        run: swift test
      - name: Test on iOS Simulator
        run: |
          UDID=$(xcrun simctl list devices available --json \
            | jq -r '[.devices | to_entries[] | select(.key | contains("iOS")) | .value[]
                     | select(.name | startswith("iPhone"))][0].udid // empty')
          if [ -z "$UDID" ]; then
            echo "::error::No available iPhone simulator on this runner"
            exit 1
          fi
          xcodebuild test -scheme SimpleHaptics -destination "id=$UDID"

  # Xcode 16.0 still compiles for iOS 13, so this job also catches availability errors in the tests.
  oldest-xcode:
    name: Build with Xcode 16.0
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - name: Select Xcode 16.0
        run: sudo xcode-select -s /Applications/Xcode_16.app
      - name: Test on macOS
        run: swift test
      - name: Build the package and its tests for iOS
        run: xcodebuild build-for-testing -scheme SimpleHaptics -destination "generic/platform=iOS Simulator"
