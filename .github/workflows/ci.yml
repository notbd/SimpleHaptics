name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - name: Install SwiftLint
        run: brew install swiftlint
      - name: SwiftLint
        run: swiftlint lint --strict
      - name: SwiftFormat
        run: swiftformat --lint .

  test:
    name: Test (macOS, iOS)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - name: Test on macOS
        run: swift test
      - name: Test on iOS Simulator
        run: |
          UDID=$(xcrun simctl list devices available --json \
            | jq -r '[.devices | to_entries[] | select(.key | contains("iOS")) | .value[]
                     | select(.name | startswith("iPhone"))][0].udid')
          xcodebuild test -scheme SimpleHaptics -destination "id=$UDID"

  build:
    name: Build (${{ matrix.platform }})
    runs-on: macos-26
    strategy:
      fail-fast: false
      matrix:
        platform:
          - iOS
          - macOS
          - macOS,variant=Mac Catalyst
          - tvOS
          - watchOS
          - visionOS
    steps:
      - uses: actions/checkout@v7
      - name: Build
        run: >
          xcodebuild build -scheme SimpleHaptics
          -destination "generic/platform=${{ matrix.platform }}"
          SWIFT_TREAT_WARNINGS_AS_ERRORS=YES

  oldest-xcode:
    name: Build with Xcode 16.0
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - name: Select Xcode 16.0
        run: sudo xcode-select -s /Applications/Xcode_16.app
      - name: Test on macOS
        run: swift test
      - name: Build for iOS
        run: xcodebuild build -scheme SimpleHaptics -destination "generic/platform=iOS"
