name: CI

# Pull requests run CI for every branch, so pushes run it only for main.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # The newest Xcode on the macos-26 runner image, and the oldest Xcode that the package supports.
  XCODE_LATEST: /Applications/Xcode_26.6.app
  XCODE_OLDEST: /Applications/Xcode_16.0.app
  SWIFTLINT_VERSION: 0.65.1
  SWIFTFORMAT_VERSION: 0.64.5

jobs:
  # GitHub often can't find a free macOS arm64 runner, so each Xcode gets one job instead of several.
  latest-xcode:
    name: Xcode 26.6
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - run: sudo xcode-select -s "$XCODE_LATEST"
      - name: Install SwiftLint and SwiftFormat
        run: |
          curl -sSfL -o swiftlint.zip \
            "https://github.com/realm/SwiftLint/releases/download/$SWIFTLINT_VERSION/portable_swiftlint.zip"
          curl -sSfL -o swiftformat.zip \
            "https://github.com/nicklockwood/SwiftFormat/releases/download/$SWIFTFORMAT_VERSION/swiftformat.zip"
          unzip -oq swiftlint.zip -d "$RUNNER_TEMP/lint-tools"
          unzip -oq swiftformat.zip -d "$RUNNER_TEMP/lint-tools"
          echo "$RUNNER_TEMP/lint-tools" >> "$GITHUB_PATH"
      - run: swiftlint lint --strict
      - run: swiftformat --lint .
      - name: Build for every platform
        run: |
          for platform in "iOS" "macOS" "macOS,variant=Mac Catalyst" "tvOS" "watchOS" "visionOS"; do
            echo "::group::$platform"
            xcodebuild build -quiet -scheme SimpleHaptics -destination "generic/platform=$platform" \
              SWIFT_TREAT_WARNINGS_AS_ERRORS=YES
            echo "::endgroup::"
          done
      - name: Build the example app
        run: >
          xcodebuild build -quiet
          -project Examples/SimpleHapticsDemo/SimpleHapticsDemo.xcodeproj
          -scheme SimpleHapticsDemo
          -destination "generic/platform=iOS Simulator"
          CODE_SIGNING_ALLOWED=NO
      - name: Test on macOS
        run: swift test
      - name: Test on iOS Simulator
        run: |
          UDID=$(xcrun simctl list devices available --json \
            | jq -r '[.devices | to_entries[] | select(.key | contains("iOS")) | .value[]
                     | select(.name | startswith("iPhone"))][0].udid // empty')
          if [ -z "$UDID" ]; then
            echo "::error::No available iPhone simulator on this runner"
            exit 1
          fi
          xcodebuild test -quiet -scheme SimpleHaptics -destination "id=$UDID"

  oldest-xcode:
    name: Xcode 16.0
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - run: sudo xcode-select -s "$XCODE_OLDEST"
      - name: Test on macOS
        run: swift test
      # Type-checking needs only the SDKs, not the simulator runtimes that the runner image doesn't always
      # install for an old Xcode.
      - name: Type-check for the other platforms at their minimum versions
        run: |
          check() {
            echo "::group::$2"
            xcrun --sdk "$1" swiftc -typecheck -swift-version 6 -warnings-as-errors -target "$2" "${@:3}" \
              Sources/SimpleHaptics/*.swift
            echo "::endgroup::"
          }
          MACOS_SDK=$(xcrun --sdk macosx --show-sdk-path)
          check iphonesimulator arm64-apple-ios13.0-simulator
          check macosx arm64-apple-ios13.1-macabi \
            -Fsystem "$MACOS_SDK/System/iOSSupport/System/Library/Frameworks" \
            -I "$MACOS_SDK/System/iOSSupport/usr/lib/swift"
          check appletvsimulator arm64-apple-tvos13.0-simulator
          check watchsimulator arm64-apple-watchos6.0-simulator
          check xrsimulator arm64-apple-xros1.0-simulator
